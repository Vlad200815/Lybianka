org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Kotlin incremental compilation breaks on Windows when the project and the
# pub cache are on different drives (D:\ vs C:\) — RelocatableFileToPathConverter
# cannot compute relative paths across drive roots.
kotlin.incremental=false
