name: lybianka
description: "Your personal finance companion — track spending, set goals & visualise your money"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Local Storage
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

  # UI
  cupertino_icons: ^1.0.8
  fl_chart: ^1.0.0
  font_awesome_flutter: ^10.8.0
  flutter_colorpicker: ^1.1.0
  flutter_flip_card: ^0.0.6
  percent_indicator: ^4.2.5

  # Media
  image_cropper: ^9.1.0
  image_picker: ^1.1.2
  video_player: ^2.10.0
  audioplayers: ^6.5.0

  # Logger
  talker_bloc_logger: ^4.9.2
  talker: ^4.9.2


  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  meta: ^1.17.0
  url_launcher: ^6.3.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


# App Icon
flutter_launcher_icons:
  android: "launcher_icon"
  ios: "AppIcon"
  image_path: "assets/app/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true


flutter:
  uses-material-design: true
  assets:
  # Appearances
    - assets/appearences/
  # Category
    - assets/categories/
  #Screamer
    - assets/screamers/
  #Ninjas
    - assets/intro/
